<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Disc Shelf icon concepts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1600px; height: 980px; box-sizing: border-box; padding: 56px 64px; background: #111315; color: #E9EBED; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 36px">
  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #A2A9B0">DISC SHELF · APP ICON</span>
    <h1 style="margin: 0; font-size: 40px; font-weight: 700">Four icon concepts</h1>
    <span style="font-size: 16px; color: #C3C8CD">Each shown large on dark and light, then at the sizes a desktop uses: 64, 48, 32 and 16 px.</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; flex: 1 1 auto">
    <sc-for list="{{concepts}}" as="c" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 14px; padding: 20px; border: 1px solid #2E3338; border-radius: 16px; background: #1A1D20">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
          <span style="font-size: 20px; font-weight: 600">{{c.name}}</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #F0A23B">{{c.letter}}</span>
        </div>
        <span style="font-size: 14px; color: #A2A9B0; min-height: 40px">{{c.idea}}</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <div style="display: flex; align-items: center; justify-content: center; height: 176px; border-radius: 12px; background: #23272B">
            <dc-import name="Icon" variant="{{c.id}}" size="{{ 144 }}" hint-size="144px,144px"></dc-import>
          </div>
          <div style="display: flex; align-items: center; justify-content: center; height: 176px; border-radius: 12px; background: #F4F4F2">
            <dc-import name="Icon" variant="{{c.id}}" size="{{ 144 }}" hint-size="144px,144px"></dc-import>
          </div>
        </div>
        <div style="display: flex; align-items: flex-end; gap: 16px; padding: 14px 16px; border-radius: 12px; background: #23272B">
          <dc-import name="Icon" variant="{{c.id}}" size="{{ 64 }}" hint-size="64px,64px"></dc-import>
          <dc-import name="Icon" variant="{{c.id}}" size="{{ 48 }}" hint-size="48px,48px"></dc-import>
          <dc-import name="Icon" variant="{{c.id}}" size="{{ 32 }}" hint-size="32px,32px"></dc-import>
          <dc-import name="Icon" variant="{{c.id}}" size="{{ 16 }}" hint-size="16px,16px"></dc-import>
        </div>
        <div style="display: flex; align-items: flex-end; gap: 16px; padding: 14px 16px; border-radius: 12px; background: #F4F4F2">
          <dc-import name="Icon" variant="{{c.id}}" size="{{ 64 }}" hint-size="64px,64px"></dc-import>
          <dc-import name="Icon" variant="{{c.id}}" size="{{ 48 }}" hint-size="48px,48px"></dc-import>
          <dc-import name="Icon" variant="{{c.id}}" size="{{ 32 }}" hint-size="32px,32px"></dc-import>
          <dc-import name="Icon" variant="{{c.id}}" size="{{ 16 }}" hint-size="16px,16px"></dc-import>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":980}}'>
class Component extends DCLogic {
renderVals() {
return {
concepts: [
  { id: 'shelf', letter: 'A', name: 'Shelf', idea: 'The name, drawn: three cases on a shelf and a disc rolling out.' },
  { id: 'sleeve', letter: 'B', name: 'Sleeve', idea: 'A disc sliding out of its case, with a play mark: rip it, then watch it.' },
  { id: 'list', letter: 'C', name: 'Matched', idea: 'A disc beside an episode list with a check: the part Disc Shelf does for you.' },
  { id: 'tile', letter: 'D', name: 'Tile', idea: 'A disc resting on a shelf line, on an amber tile. Simplest at small sizes.' }
]
};
}
}
</script>
</body>
</html>
