name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the tools the app drives
        run: |
          sudo apt-get update
          # Qt's offscreen platform still loads EGL, xkbcommon, fontconfig and D-Bus.
          sudo apt-get install -y --no-install-recommends ffmpeg mkvtoolnix tesseract-ocr tesseract-ocr-eng \
            rsync libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install Disc Shelf
        run: pip install -e ".[ocr,test]"
      - name: Run the tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q discshelf

  # Builds the whole Flatpak, ffmpeg and mkvtoolnix included, which takes about an hour on
  # GitHub's runners, so it runs on request (Actions, Tests, Run workflow) and for tags.
  flatpak:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Find the manifest
        id: manifest
        # packaging/<app id>.yml, so renaming the app id doesn't need a change here.
        run: |
          path=$(ls packaging/*.*.*.yml | head -n 1)
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "bundle=$(basename "$path" .yml).flatpak" >> "$GITHUB_OUTPUT"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: ${{ steps.manifest.outputs.path }}
          bundle: ${{ steps.manifest.outputs.bundle }}
          cache-key: flatpak-builder-${{ github.sha }}
